<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor PDF Libro Interactivo</title>

  <!-- PDF.js y PageFlip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden !important; /* Evita cualquier barra de desplazamiento global */
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px;
    }

    /* Loader */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Contenedor del Libro sin Scrollbars */
    #viewport-wrapper {
      width: 100%;
      height: calc(100vh - 130px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden !important; /* Oculta cualquier desborde al pasar la hoja */
      position: relative;
    }

    #flipbook-container {
      display: none;
      transition: transform 0.3s ease-out;
      transform-origin: center center;
      will-change: transform;
    }

    #flipbook {
      margin: 0 auto;
      /* Previene el parpadeo/temblor acelerando por hardware */
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .page {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      display: block;
    }

    /* Barra Inferior de Controles */
    .footer-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      z-index: 100;
      margin-top: auto;
    }

    .controls {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 30px;
      display: flex;
      gap: 8px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: #334155;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: background 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      user-select: none;
    }

    .btn:hover {
      background: #0284c7;
    }

    .btn-audio {
      background: #10b981;
    }

    .btn-audio:hover {
      background: #059669;
    }

    .btn-download {
      background: #0284c7;
    }

    .btn-download:hover {
      background: #0369a1;
    }

    #page-info {
      font-size: 0.85rem;
      color: #94a3b8;
      min-width: 90px;
      text-align: center;
    }

    .footer-title {
      font-size: 0.68rem;
      letter-spacing: 0.8px;
      color: #94a3b8;
      text-transform: uppercase;
      text-align: center;
      padding: 2px 8px;
      max-width: 95vw;
    }

    @media (max-width: 600px) {
      #viewport-wrapper {
        height: calc(100vh - 145px);
      }
      .controls {
        padding: 6px 10px;
        gap: 4px;
      }
      .btn {
        padding: 5px 8px;
        font-size: 0.75rem;
      }
      .footer-title {
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- Mensaje de Carga -->
  <div id="loading">
    <div class="spinner"></div>
    <div id="status-text">Cargando PDF...</div>
  </div>

  <!-- Contenedor del Libro -->
  <div id="viewport-wrapper">
    <div id="flipbook-container">
      <div id="flipbook"></div>
    </div>
  </div>

  <!-- Pie con Controles -->
  <div class="footer-wrapper">
    <div class="controls">
      <button class="btn" id="prev-btn">Anterior</button>
      <span id="page-info">Página 0 / 0</span>
      <button class="btn" id="next-btn">Siguiente</button>

      <!-- Zoom -->
      <button class="btn" id="zoom-in-btn" title="Acercar">+</button>
      <button class="btn" id="zoom-out-btn" title="Alejar">-</button>

      <!-- Escuchar -->
      <button class="btn btn-audio" id="speak-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        Escuchar
      </button>

      <!-- Descargar -->
      <a class="btn btn-download" id="download-btn" href="#" download="PORTALDELAGENTE.pdf" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Descargar
      </a>
    </div>

    <div class="footer-title">
      CREADO EN LA DIRECCIÓN DE LIQUIDACIONES - FUNCIÓN LEGISLATIVA
    </div>
  </div>

  <script>
    const PDF_URL = 'https://drive.google.com/file/d/1MT6J2vMWfjkdpLDugOVvlX2u2bi700zY/view';
    document.getElementById('download-btn').href = PDF_URL;

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pageFlip = null;
    let pageTexts = [];
    let currentZoom = 1;

    async function cargarPDF() {
      try {
        const loadingTask = pdfjsLib.getDocument(PDF_URL);
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;

        const flipbookEl = document.getElementById('flipbook');

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          
          // Extraer texto de la página
          const textContent = await page.getTextContent();
          const pageString = textContent.items.map(item => item.str).join(' ');
          pageTexts[pageNum] = pageString;

          const viewport = page.getViewport({ scale: 2.0 });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';
          pageDiv.setAttribute('data-density', pageNum === 1 ? 'hard' : 'soft');

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          pageDiv.appendChild(canvas);
          flipbookEl.appendChild(pageDiv);

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          document.getElementById('status-text').innerText = `Procesando página ${pageNum} de ${totalPages}...`;
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('flipbook-container').style.display = 'block';

        // CONFIGURACIÓN ANTI-TEMBLOR / ANTI-SCROLLBAR
        pageFlip = new St.PageFlip(flipbookEl, {
          width: 430,
          height: 590,
          size: 'fixed',
          minWidth: 280,
          maxWidth: 600,
          minHeight: 380,
          maxHeight: 800,
          maxShadowOpacity: 0.3,
          showCover: true,
          usePortrait: false,
          autoSize: false,
          drawShadow: true,
          mobileScrollSupport: false // Desactiva scroll directo para frenar saltos
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        actualizarInfoPagina(1, totalPages);

        pageFlip.on('flip', (e) => {
          actualizarInfoPagina(e.data + 1, totalPages);
          window.speechSynthesis.cancel();
        });

        // Controles Navegación
        document.getElementById('prev-btn').addEventListener('click', () => pageFlip.flipPrev());
        document.getElementById('next-btn').addEventListener('click', () => pageFlip.flipNext());

        // Controles Zoom
        document.getElementById('zoom-in-btn').addEventListener('click', () => cambiarZoom(0.15));
        document.getElementById('zoom-out-btn').addEventListener('click', () => cambiarZoom(-0.15));

        // Control Voz
        document.getElementById('speak-btn').addEventListener('click', hablarPaginaActual);

      } catch (error) {
        console.error("Error:", error);
        document.getElementById('status-text').innerText = 'Error al procesar el archivo PDF.';
      }
    }

    function actualizarInfoPagina(paginaActual, total) {
      if (paginaActual === 1) {
        document.getElementById('page-info').innerText = `Portada (1 / ${total})`;
      } else {
        const pagIzquierda = paginaActual % 2 === 0 ? paginaActual : paginaActual - 1;
        const pagDerecha = pagIzquierda + 1 <= total ? pagIzquierda + 1 : total;
        document.getElementById('page-info').innerText = `Pág. ${pagIzquierda}-${pagDerecha} / ${total}`;
      }
    }

    function cambiarZoom(delta) {
      currentZoom = Math.min(Math.max(0.7, currentZoom + delta), 1.5);
      document.getElementById('flipbook-container').style.transform = `scale(${currentZoom})`;
    }

    function hablarPaginaActual() {
      if ('speechSynthesis' in window) {
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
          return;
        }

        const currentPageIndex = pageFlip.getCurrentPageIndex() + 1;
        let texto = pageTexts[currentPageIndex] || '';

        if (currentPageIndex > 1 && pageTexts[currentPageIndex + 1]) {
          texto += ' ' + pageTexts[currentPageIndex + 1];
        }

        if (texto && texto.trim().length > 0) {
          const utterance = new SpeechSynthesisUtterance(texto);
          utterance.lang = 'es-ES';
          utterance.rate = 0.95;
          window.speechSynthesis.speak(utterance);
        } else {
          alert('No se detectó texto en esta página para reproducir.');
        }
      } else {
        alert('Tu navegador no soporta la síntesis de voz.');
      }
    }

    window.addEventListener('load', cargarPDF);
  </script>
</body>
</html>
